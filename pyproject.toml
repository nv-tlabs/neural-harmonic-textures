# Editable install for superproject-only helpers (AOV dataset, examples).
# Run from repo root: pip install -e .

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aov"
version = "0.0.0"
description = "NHT release AOV helpers (dataset wrapper and training/view scripts)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["aov*"]
